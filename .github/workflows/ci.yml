name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback on every push: lint + the unit tests that need no
  # infrastructure. This is the job that has to stay under two minutes,
  # because a check nobody waits for is a check nobody reads.
  # ---------------------------------------------------------------------------
  unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        # No flags here on purpose. Passing --extend-ignore on the command
        # line REPLACES the one in setup.cfg rather than adding to it, so the
        # codes configured there come back and the build fails on style the
        # project has deliberately opted out of. Let setup.cfg be the single
        # source of truth, exactly as it is when run locally.
        run: flake8 .

      - name: Unit tests
        env:
          MYSQL_PASSWORD: unused-no-db-in-this-job
        run: pytest tests/ -v --tb=short

      - name: Split-integrity tests
        # Called out separately because these are the tests that guard the
        # project's central correctness claim — no evaluation-period
        # information reaches the model. If they go red, nothing downstream
        # is worth reading.
        env:
          MYSQL_PASSWORD: unused-no-db-in-this-job
        run: pytest tests/test_split_integrity.py -v

  # ---------------------------------------------------------------------------
  # Full retrain + model gate. MANUAL ONLY (Actions tab -> Run workflow).
  #
  # It needs the raw Olist CSVs, which are DVC-tracked and not in the repo —
  # there is no public DVC remote to pull them from, because the dataset is
  # Kaggle-licensed and cannot be redistributed here. Running this on every
  # push to main would therefore fail every time, and a permanently red badge
  # trains everyone to ignore the badge.
  #
  # So the badge reflects what CI can honestly verify without the data: lint,
  # unit tests, and the split-integrity suite. The retrain-and-gate job is
  # real and runnable — point it at a DVC remote or a Kaggle secret and it
  # runs end to end — it just isn't claimed as passing when it cannot run.
  # ---------------------------------------------------------------------------
  pipeline:
    name: End-to-end pipeline + model gate (manual)
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'workflow_dispatch'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sentrix
          MYSQL_USER: sentrix_user
          MYSQL_PASSWORD: sentrix_pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: sentrix_user
      MYSQL_PASSWORD: sentrix_pass
      MYSQL_DATABASE: sentrix

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull DVC-tracked data
        run: |
          dvc pull --allow-missing || \
            echo "::warning::DVC remote unavailable — falling back to files in the repo"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 15); do
            mysqladmin ping -h 127.0.0.1 -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent && break
            sleep 2
          done

      - name: Create schema
        run: python -m src.ingestion.schema

      - name: Load real Olist data
        run: python -m src.ingestion.olist_loader

      - name: Build external-signal layer (real FRED + flagged synthetic)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.ingestion.synthetic_signals

      - name: Integration tests against a live database
        run: pytest tests/ -v --tb=short

      - name: Build feature table
        run: python scripts/build_features.py

      - name: Train all models
        run: python -m src.models.trainer --stages baseline boosting ensemble lstm

      - name: Evaluate, calibrate, pick the operating point
        run: python -m src.evaluation.run_evaluation

      - name: Model performance gate
        # Fails the build if the champion drops below the PR-AUC floor in
        # config.yaml. Unit tests prove the code runs; this proves the model
        # it produces is still worth shipping.
        run: python scripts/validate_model.py

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: artifacts/evaluation/
          if-no-files-found: warn
