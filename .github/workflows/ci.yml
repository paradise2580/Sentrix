name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Every push: lint + unit tests (no database needed).
  unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        # No CLI flags: setup.cfg is the single source of lint settings.
        run: flake8 .

      - name: Unit tests
        env:
          MYSQL_PASSWORD: unused-no-db-in-this-job
        run: pytest tests/ -v --tb=short

      - name: Split-integrity tests
        # Run separately for visibility: these guard against data leakage.
        env:
          MYSQL_PASSWORD: unused-no-db-in-this-job
        run: pytest tests/test_split_integrity.py -v

  # Full retrain + model gate. MANUAL ONLY (Actions tab -> Run workflow),
  # because the Kaggle-licensed Olist data can't be stored in the repo or CI.
  pipeline:
    name: End-to-end pipeline + model gate (manual)
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'workflow_dispatch'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sentrix
          MYSQL_USER: sentrix_user
          MYSQL_PASSWORD: sentrix_pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: sentrix_user
      MYSQL_PASSWORD: sentrix_pass
      MYSQL_DATABASE: sentrix

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull DVC-tracked data
        run: |
          dvc pull --allow-missing || \
            echo "::warning::DVC remote unavailable — falling back to files in the repo"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 15); do
            mysqladmin ping -h 127.0.0.1 -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent && break
            sleep 2
          done

      - name: Create schema
        run: python -m src.ingestion.schema

      - name: Load real Olist data
        run: python -m src.ingestion.olist_loader

      - name: Build external-signal layer (real FRED + flagged synthetic)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.ingestion.synthetic_signals

      - name: Integration tests against a live database
        run: pytest tests/ -v --tb=short

      - name: Build feature table
        run: python scripts/build_features.py

      - name: Train all models
        run: python -m src.models.trainer --stages baseline boosting ensemble lstm

      - name: Evaluate, calibrate, pick the operating point
        run: python -m src.evaluation.run_evaluation

      - name: Model performance gate
        # Fails if the best model's PR-AUC is below monitoring.pr_auc_gate.
        run: python scripts/validate_model.py

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: artifacts/evaluation/
          if-no-files-found: warn
