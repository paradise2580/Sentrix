name: CD

# Runs only after CI has passed on main — never deploys unvalidated code.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sentrix-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sentrix-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment step (Phase 14) — placeholder until a target environment
      # (AWS EC2/ECS, Streamlit Community Cloud, etc.) is provisioned.
