name: CD

# Runs only after CI has passed on main — never publishes unvalidated code.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    name: Build and publish API image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    # Read the username into an env var so the steps below can branch on
    # whether it is configured. A secret cannot be tested directly in a
    # job-level `if:` — the secrets context is not available there — which
    # is why this is a step rather than a job condition.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for registry credentials
        id: creds
        # Without this guard the workflow fails at the login step on every
        # run of a fork or a repo where the secrets were never set, which
        # puts a permanent red X on the repository for a reason that has
        # nothing to do with the code. A publish step with nowhere to
        # publish should no-op and say so, not fail.
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Image publish skipped::DOCKERHUB_USERNAME / \
            DOCKERHUB_TOKEN are not configured for this repository, so there is \
            no registry to push to. Add them under Settings > Secrets and \
            variables > Actions to enable publishing."
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        if: steps.creds.outputs.present == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sentrix-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sentrix-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment step — placeholder until a target environment
      # (AWS EC2/ECS, Streamlit Community Cloud, etc.) is provisioned.
      # Example for EC2 via SSH:
      #
      # - name: Deploy to EC2
      #   if: steps.creds.outputs.present == 'true'
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     script: |
      #       docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sentrix-api:latest
      #       docker compose -f /opt/sentrix/docker-compose.yml up -d
