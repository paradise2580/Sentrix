name: Keep-alive

# Pings both Render services every 5 minutes so they don't sleep (Render's
# free plan sleeps after 15 idle minutes). GitHub may delay scheduled runs,
# and disables them after 60 days without commits.
# URLs can be overridden with the SENTRIX_API_URL / SENTRIX_DASHBOARD_URL
# repository variables.
# different service name.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping deployed services
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.SENTRIX_API_URL || 'https://sentrix-api-t1dw.onrender.com' }}
      DASHBOARD_URL: ${{ vars.SENTRIX_DASHBOARD_URL || 'https://sentrix-dashboard.onrender.com' }}

    steps:
      - name: Ping API /health
        run: curl -fsS --max-time 60 "$API_URL/health"

      - name: Ping dashboard
        run: curl -fsS --max-time 60 -o /dev/null "$DASHBOARD_URL"
