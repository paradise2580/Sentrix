project:
  name: sentrix
  version: 1.0.0
  random_state: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  artifacts: artifacts
  logs: logs
  models: artifacts/models
  preprocessor: artifacts/preprocessor.joblib
  chroma_db: artifacts/chroma
  mlflow_tracking_uri: artifacts/mlruns

mysql:
  # Non-secret defaults. The password comes from MYSQL_PASSWORD in .env, and
  # any value here can be overridden by the matching MYSQL_* variable.
  host: 127.0.0.1
  port: 3306
  user: sentrix_user
  database: sentrix
  tables:
    sellers: sellers
    customers: customers
    products: products
    orders: orders
    order_items: order_items
    reviews: reviews
    external_signals: external_signals
    predictions: predictions

preprocessing:
  # Share of the timeline held out for test and for calibration.
  test_size: 0.20
  calibration_size: 0.10
  # Gap dropped before each later block. Must be >= label_horizon_days so no
  # training label resolves inside the next block.
  embargo_days: 30
  label_horizon_days: 30

  # --- used only by the retired seller-level model (feature_eng.py) ---
  late_rate_threshold: 0.15      # seller is positive if forward late rate >= 15%
  min_forward_orders: 5          # seller-days with fewer forward orders are unlabelled

  rolling_windows: [7, 14, 30]
  outlier_iqr_multiplier: 1.5
  # Sellers with fewer lifetime orders are dropped from the seller-day panel.
  active_min_orders: 10

# --- order-level model (current) ---
order_model:
  # Seller/state history is computed as of this many days before each order,
  # because recent orders don't have a delivery outcome yet.
  history_lag_days: 30
  # Less common product categories are grouped as 'other'.
  top_categories: 20
  # Seller risk = mean predicted risk of the seller's orders in the last
  # `seller_rollup_window` days; sellers with fewer orders than the minimum
  # are not ranked.
  seller_rollup_window: 90
  seller_rollup_min_orders: 5

model:
  # 1 if the order was delivered after its promised date.
  target_column: is_late_delivery

  logistic_regression:
    max_iter: 1000
    class_weight: balanced

  random_forest:
    n_estimators: 300
    max_depth: 10
    class_weight: balanced

  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    eval_metric: logloss

  lightgbm:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05

  ensemble:
    # Forward-chaining folds (TimeSeriesSplit) for the stacker.
    n_splits: 3

  optuna:
    n_trials: 25
    # Forward-chaining folds, never shuffled k-fold.
    cv_folds: 3
    # Tune on the most recent N training rows to save time.
    tune_sample_rows: 80000
    direction: maximize
    scoring: average_precision

  lstm:
    sequence_length: 30
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    epochs: 12
    batch_size: 256
    learning_rate: 0.001

  # Fitted on the held-out calibration block.
  calibration_method: isotonic

  # A missed late order is treated as 10x as costly as a false alarm; the
  # decision threshold is chosen to minimise total cost.
  cost_false_negative: 10.0
  cost_false_positive: 1.0

  decision_threshold: 0.5

  # Bands are by rank, not fixed probability cutoffs: with a ~5% base rate,
  # calibrated scores are rarely high enough to fill fixed top bands.
  risk_band_quantiles:
    critical: 0.95   # top 5% of scored sellers
    high: 0.80       # next 15%
    medium: 0.50     # next 30%

rag:
  chunk_size: 512
  chunk_overlap: 50
  top_k: 4
  embedding_model: all-MiniLM-L6-v2
  # Tried in order if a model has been retired by the provider.
  llm_model: openai/gpt-oss-20b
  llm_fallback_models:
    - openai/gpt-oss-120b
    - groq/compound-mini
  llm_provider: groq
  temperature: 0.0

api:
  host: 0.0.0.0
  port: 8000
  title: SENTRIX API

frontend:
  api_base_url: http://localhost:8000
  port: 8501

monitoring:
  drift_report_path: logs/drift_report.html
  # CI model gate: the build fails if the best model's PR-AUC is below this.
  # Current champion scores 0.153; the gate leaves headroom for run-to-run noise.
  pr_auc_gate: 0.13
