project:
  name: sentrix
  version: 1.0.0
  random_state: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  artifacts: artifacts
  logs: logs
  models: artifacts/models
  preprocessor: artifacts/preprocessor.joblib
  chroma_db: artifacts/chroma
  mlflow_tracking_uri: artifacts/mlruns

mysql:
  # Non-secret connection defaults only. The password is deliberately absent:
  # it is read from MYSQL_PASSWORD in .env (see .env.example). Any of these
  # can be overridden by the matching MYSQL_* environment variable.
  host: 127.0.0.1
  port: 3306
  user: sentrix_user
  database: sentrix
  tables:
    sellers: sellers
    customers: customers
    products: products
    orders: orders
    order_items: order_items
    reviews: reviews
    external_signals: external_signals
    predictions: predictions

preprocessing:
  # Fraction of the timeline held out for final test / for calibration.
  test_size: 0.20
  calibration_size: 0.10
  # Gap enforced before each downstream block. Must be >= label_horizon_days,
  # otherwise a retained training label resolves inside the next block and
  # the held-out score is optimistic. See models/trainer.py.
  embargo_days: 30
  label_horizon_days: 30
  rolling_windows: [7, 14, 30]
  outlier_iqr_multiplier: 1.5
  # Sellers below this lifetime order count are dropped: too little history
  # to model, and they would otherwise dominate the panel with empty rows.
  active_min_orders: 10

model:
  target_column: disruption_next_30d

  logistic_regression:
    max_iter: 1000
    class_weight: balanced

  random_forest:
    n_estimators: 300
    max_depth: 10
    class_weight: balanced

  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    eval_metric: logloss

  lightgbm:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05

  ensemble:
    # Folds for the stacker's TimeSeriesSplit. Never a plain k-fold here —
    # see models/ensemble.py for what that cost the first time round.
    n_splits: 3

  optuna:
    n_trials: 25
    # Forward-chaining folds, never a shuffled k-fold — see models/boosting.py.
    cv_folds: 3
    # Tune on the most recent N training rows. Hyperparameter ranking is
    # stable under subsampling; fit time is not.
    tune_sample_rows: 80000
    direction: maximize
    scoring: average_precision

  lstm:
    sequence_length: 30
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    epochs: 12
    batch_size: 256
    learning_rate: 0.001

  # Post-hoc probability calibration, fitted on the held-out calibration block.
  calibration_method: isotonic

  # Relative business cost of the two error types. A seller who goes late
  # unflagged costs ~10x an analyst's wasted review; the cost-optimal
  # decision threshold is derived from this ratio rather than defaulting
  # to 0.5, which silently assumes the two errors are equally bad.
  cost_false_negative: 10.0
  cost_false_positive: 1.0

  decision_threshold: 0.5

  # Risk bands are CAPACITY-based, not fixed probability cuts. With a base
  # rate near 0.17 a calibrated model almost never emits a probability above
  # 0.75, so absolute cuts of 0.25/0.50/0.75 would leave the top bands
  # permanently empty and the dashboard permanently green. Percentile bands
  # instead answer the question an ops team actually asks — "who are the
  # worst 5% this week?" — and line up directly with the capture@k metrics.
  risk_band_quantiles:
    critical: 0.95   # top 5% of the scored population
    high: 0.80       # next 15%
    medium: 0.50     # next 30%

rag:
  chunk_size: 512
  chunk_overlap: 50
  top_k: 4
  embedding_model: all-MiniLM-L6-v2
  llm_model: llama-3.3-70b-versatile
  llm_provider: groq
  temperature: 0.0

api:
  host: 0.0.0.0
  port: 8000
  title: SENTRIX API

frontend:
  api_base_url: http://localhost:8000
  port: 8501

monitoring:
  drift_report_path: logs/drift_report.html
  # CI fails the build if the best model's PR-AUC on the shared evaluation
  # set falls below this. Set from the current champion with headroom for
  # run-to-run variance, not aspirationally.
  pr_auc_gate: 0.30
