[flake8]
max-line-length = 110
# E203/W503  disagree with black's slicing and line-break conventions
# E127/E128/E131 continuation-line alignment — cosmetic, and enforcing them
#                fights every reasonable way of wrapping a long call
# E402       conftest.py must extend sys.path before importing src
extend-ignore = E203, W503, E127, E128, E131, E402
exclude = .git, __pycache__, venv, .venv, mlruns, artifacts, data, notebooks
per-file-ignores =
    tests/*: E731

[tool:pytest]
testpaths = tests
addopts = --strict-markers
markers =
    integration: needs a live MySQL or ChromaDB instance
